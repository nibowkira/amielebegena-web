<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-HWVNQZSCYP"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-HWVNQZSCYP');

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Error - Amiele Begena</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="affiliate-styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            background-color: #0d1a13;
            color: #f5f4f0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 2rem;
            position: relative;
            overflow: hidden;
            font-family: 'Outfit', sans-serif;
        }

        /* Ambient glows */
        body::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.05) 0%, transparent 70%);
            top: -10%;
            left: -10%;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.03) 0%, transparent 70%);
            bottom: -10%;
            right: -10%;
            pointer-events: none;
        }

        .error-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(40px) saturate(150%);
            -webkit-backdrop-filter: blur(40px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 
                0 30px 70px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            border-radius: 28px;
            padding: 4rem 3rem;
            max-width: 500px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 2;
            animation: cardFadeUp 0.6s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        @keyframes cardFadeUp {
            from { opacity: 0; transform: translateY(30px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .error-icon-container {
            width: 90px;
            height: 90px;
            background: rgba(212, 175, 55, 0.07);
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 24px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            color: #ffd700;
            margin-bottom: 2rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        .error-card h1 {
            font-family: 'Benaiah', 'Cormorant Garamond', serif;
            font-size: 2.4rem;
            margin: 0 0 1rem;
            color: #ffffff;
            font-weight: 600;
        }

        .error-card p {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.6;
            margin: 0 0 2.5rem;
        }

        .error-btn {
            display: inline-block;
            background: linear-gradient(135deg, #ffd700 0%, #c9a800 100%);
            color: #14231b;
            border: none;
            border-radius: 12px;
            padding: 0.9rem 2.2rem;
            font-weight: 700;
            font-size: 0.88rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.15);
        }

        .error-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(212, 175, 55, 0.3);
        }

        .error-btn:active {
            transform: translateY(0);
        }

        .offline-retry-dot {
            width: 8px;
            height: 8px;
            background-color: #ffd700;
            border-radius: 50%;
            display: inline-block;
            margin-left: 6px;
            animation: pulseDot 1.5s infinite;
        }

        @keyframes pulseDot {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.4; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-icon-container" id="error-icon">
            <i class="fas fa-exclamation-circle"></i>
        </div>
        <h1 id="error-title">Page Not Found</h1>
        <p id="error-description">The page you are looking for does not exist or has been moved to another location.</p>
        <a href="index.html" class="error-btn" id="error-action-btn">Back to Home</a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const errorType = urlParams.get('type') || '404';

            const iconContainer = document.getElementById('error-icon');
            const titleEl = document.getElementById('error-title');
            const descEl = document.getElementById('error-description');
            const actionBtn = document.getElementById('error-action-btn');

            if (errorType === '403') {
                // Unauthorized
                iconContainer.innerHTML = '<i class="fas fa-lock"></i>';
                titleEl.textContent = 'Access Restricted';
                descEl.textContent = 'You do not have administrative or affiliate permissions to view this secure portal area. Please authenticate using partner credentials.';
                actionBtn.textContent = 'Sign In Portal';
                actionBtn.href = 'login.html?redirect=affiliate-dashboard.html';
            } else if (errorType === 'empty') {
                // Empty search outcome
                iconContainer.innerHTML = '<i class="fas fa-search"></i>';
                titleEl.textContent = 'No Search Results';
                descEl.textContent = 'We could not find any matching products or historical documents in our registry matching your search terms. Try refining your spelling.';
                actionBtn.textContent = 'Clear Filters';
                actionBtn.href = 'products.html';
            } else if (errorType === 'offline') {
                // Offline Mode
                iconContainer.innerHTML = '<i class="fas fa-wifi-slash"></i>';
                titleEl.textContent = 'Connection Disconnected';
                descEl.textContent = 'Your device is currently disconnected from the network. Amiele Begena requires a network connection to process commissions and payouts.';
                actionBtn.innerHTML = 'Retry Connection <span class="offline-retry-dot"></span>';
                actionBtn.href = '#';
                
                actionBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    if (navigator.onLine) {
                        const redirect = urlParams.get('redirect') || 'index.html';
                        window.location.href = redirect;
                    } else {
                        // Flashing alert
                        descEl.style.color = '#ff6b6b';
                        setTimeout(() => { descEl.style.color = 'rgba(255,255,255,0.6)'; }, 500);
                    }
                });

                // Auto monitor reconnect
                setInterval(() => {
                    if (navigator.onLine) {
                        const redirect = urlParams.get('redirect') || 'index.html';
                        window.location.href = redirect;
                    }
                }, 3000);
            }
        });
    </script>
</body>
</html>
