    <script>
    /**
     * Amiele Begena — Dedicated Notification Center Logic
     */
    (function () {
        'use strict';

        let currentPage = 1;
        let currentFilter = 'all';
        let currentSearch = '';
        let totalPages = 1;

        const listEl       = document.getElementById('nc-list');
        const unreadPill   = document.getElementById('nc-unread-pill');
        const searchInput  = document.getElementById('nc-search-input');
        const filterPills  = document.getElementById('nc-filter-pills');
        const markAllBtn   = document.getElementById('nc-btn-mark-all');
        const prevBtn      = document.getElementById('nc-prev-btn');
        const nextBtn      = document.getElementById('nc-next-btn');
        const pageInfo     = document.getElementById('nc-page-info');

        const esc = window.AmieleSanitize
            ? window.AmieleSanitize.escapeHtml
            : function (v) { return v == null ? '' : String(v).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); };

        function formatRelativeTime(dateStr) {
            if (!dateStr) return '';
            try {
                const date = new Date(dateStr);
                const now = new Date();
                const diffSec = Math.floor((now - date) / 1000);
                if (diffSec < 60) return 'Just now';
                const diffMin = Math.floor(diffSec / 60);
                if (diffMin < 60) return `${diffMin} min ago`;
                const diffHr = Math.floor(diffMin / 60);
                if (diffHr < 24) return `${diffHr} ${diffHr === 1 ? 'hour' : 'hours'} ago`;
                const diffDays = Math.floor(diffHr / 24);
                if (diffDays === 1) return 'Yesterday';
                return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            } catch { return ''; }
        }

        function getNotificationIcon(type) {
            const t = (type || '').toLowerCase();
            if (t.includes('order_created')) return 'fa-shopping-bag';
            if (t.includes('payment')) return 'fa-check-circle';
            if (t.includes('preparing')) return 'fa-scissors';
            if (t.includes('crafting')) return 'fa-hammer';
            if (t.includes('packed')) return 'fa-box';
            if (t.includes('shipped')) return 'fa-plane-departure';
            if (t.includes('delivered')) return 'fa-box-open';
            if (t.includes('commission')) return 'fa-coins';
            if (t.includes('withdrawal')) return 'fa-wallet';
            if (t.includes('affiliate')) return 'fa-user-check';
            if (t.includes('warning') || t.includes('stock')) return 'fa-exclamation-triangle';
            return 'fa-bell';
        }

        function getNavigationTarget(item) {
            const refType = (item.reference_type || '').toLowerCase();
            const type = (item.type || '').toLowerCase();
            const role = item.user_role || 'customer';

            if (refType === 'order') {
                if (role === 'admin') return 'admin.html#orders';
                return `track-order.html?order=${encodeURIComponent(item.reference_id || '')}`;
            }
            if (refType === 'withdrawal' || type.includes('withdrawal')) {
                if (role === 'admin') return 'admin.html#withdrawals';
                return 'affiliate-dashboard.html#withdrawals';
            }
            if (refType === 'commission' || type.includes('commission')) {
                return 'affiliate-dashboard.html#commissions';
            }
            if (type === 'affiliate_approved') {
                return 'affiliate-dashboard.html';
            }
            if (refType === 'application' || type.includes('affiliate')) {
                if (role === 'admin' || window.location.pathname.includes('admin')) return 'admin.html#affiliates';
                return 'affiliate-dashboard.html';
            }
            return null;
        }

        async function loadNotifications() {
            if (!window.NotificationsService) return;

            const res = await window.NotificationsService.getNotifications({
                page: currentPage,
                limit: 15,
                filter: currentFilter,
                search: currentSearch
            });

            if (!res.success) {
                listEl.innerHTML = `
                    <div class="nc-empty-card">
                        <i class="fas fa-exclamation-circle" style="color:#C53030; font-size:2rem; margin-bottom:8px;"></i>
                        <h3>Failed to Load Notifications</h3>
                        <p>${esc(res.error || 'Error fetching notifications.')}</p>
                    </div>
                `;
                return;
            }

            // Update unread pill
            unreadPill.textContent = `${res.unreadCount} unread`;

            // Pagination info
            totalPages = res.totalPages || 1;
            pageInfo.textContent = `Page ${res.page} of ${totalPages} (${res.totalCount} total)`;
            prevBtn.disabled = currentPage <= 1;
            nextBtn.disabled = currentPage >= totalPages;

            if (!res.notifications || !res.notifications.length) {
                listEl.innerHTML = `
                    <div class="nc-empty-card">
                        <div class="nc-empty-icon"><i class="fas fa-bell-slash"></i></div>
                        <h3>No Notifications Found</h3>
                        <p>No notifications match your current filter or search criteria.</p>
                    </div>
                `;
                return;
            }

            listEl.innerHTML = res.notifications.map((item) => {
                const isUnread = !item.is_read;
                const icon = getNotificationIcon(item.type);
                const relTime = formatRelativeTime(item.created_at);
                const targetUrl = getNavigationTarget(item);

                return `
                    <div class="nc-card ${isUnread ? 'unread' : 'read'}" data-id="${item.id}" data-target="${targetUrl || ''}">
                        <div class="nc-card-icon">
                            <i class="fas ${icon}"></i>
                        </div>
                        <div class="nc-card-content">
                            <div class="nc-card-top">
                                <div class="nc-card-title">
                                    <span class="nc-indicator-dot ${isUnread ? 'gold' : 'gray'}"></span>
                                    ${esc(item.title)}
                                </div>
                                <span class="nc-card-time">${relTime}</span>
                            </div>
                            <div class="nc-card-msg">${esc(item.message)}</div>
                            <div class="nc-card-footer">
                                ${item.reference_type ? `<span class="nc-ref-tag"><i class="fas fa-tag"></i> ${esc(item.reference_type)}</span>` : '<span></span>'}
                                <div class="nc-card-actions">
                                    <button class="nc-action-icon-btn nc-delete-btn" data-id="${item.id}" title="Delete notification">
                                        <i class="fas fa-trash-alt"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            // Card click listeners
            listEl.querySelectorAll('.nc-card').forEach((card) => {
                card.addEventListener('click', async (e) => {
                    if (e.target.closest('.nc-delete-btn')) return;

                    const id = card.getAttribute('data-id');
                    const target = card.getAttribute('data-target');

                    if (window.NotificationsService) {
                        await window.NotificationsService.markAsRead(id);
                    }
                    loadNotifications();
                });
            });

            // Delete button listeners
            listEl.querySelectorAll('.nc-delete-btn').forEach((btn) => {
                btn.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    const id = btn.getAttribute('data-id');
                    if (window.NotificationsService && id) {
                        await window.NotificationsService.deleteNotification(id);
                        loadNotifications();
                    }
                });
            });
        }

        // Search Input Handler (Debounced)
        let searchTimer = null;
        searchInput.addEventListener('input', () => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => {
                currentSearch = searchInput.value;
                currentPage = 1;
                loadNotifications();
            }, 300);
        });

        // Filter Pills Handler
        filterPills.querySelectorAll('.nc-pill').forEach((pill) => {
            pill.addEventListener('click', () => {
                filterPills.querySelectorAll('.nc-pill').forEach(p => p.classList.remove('active'));
                pill.classList.add('active');
                currentFilter = pill.getAttribute('data-filter');
                currentPage = 1;
                loadNotifications();
            });
        });

        // Mark All Read
        markAllBtn.addEventListener('click', async () => {
            if (window.NotificationsService) {
                await window.NotificationsService.markAllAsRead();
                loadNotifications();
            }
        });

        // Pagination Prev / Next
        prevBtn.addEventListener('click', () => {
            if (currentPage > 1) {
                currentPage--;
                loadNotifications();
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentPage < totalPages) {
                currentPage++;
                loadNotifications();
            }
        });

        // Initial Load
        loadNotifications();

        // Supabase Realtime Listener
        if (window.NotificationsService) {
            window.NotificationsService.subscribeToRealtime(() => {
                loadNotifications();
            });
        }
    })();
    </script>
</body>
</html>
